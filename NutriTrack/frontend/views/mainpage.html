
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriTrack | Nutrition Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand bg-white border-bottom px-3 px-md-4">
        <a class="navbar-brand fw-bold text-success fs-4" href="#">
            <span class="brand-icon">LOGO</span> NutriTrack
        </a>

        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="text-secondary small d-none d-sm-inline">
                Nutrition made simple
            </span>
            <button class="btn btn-light rounded-circle profile-button"
                    type="button" data-page="profile" aria-label="Open profile">
                <span>U</span>
            </button>
        </div>
    </nav>

    <div class="app-layout">

        <aside class="sidebar">
            <p class="sidebar-label">MENU</p>

            <button class="nav-link-custom active" type="button"
                    data-page="dashboard">
                <span class="nav-icon">⌂</span> Dashboard
            </button>

            <button class="nav-link-custom" type="button"
                    data-page="food-search">
                <span class="nav-icon">⌕</span> Food Search
            </button>

            <button class="nav-link-custom" type="button"
                    data-page="diary">
                <span class="nav-icon">▤</span> Meal Diary
            </button>

            <button class="nav-link-custom" type="button"
                    data-page="history">
                <span class="nav-icon">◷</span> History
            </button>

            <div class="sidebar-divider"></div>

            <p class="sidebar-label">ACCOUNT</p>

            <button class="nav-link-custom" type="button"
                    data-page="profile">
                <span class="nav-icon">⚙</span> Profile & Goals
            </button>
            <button class="nav-link-custom" data-page="login">
                Login
            </button>

            <button class="nav-link-custom" data-page="register">
                Register
            </button>

            <div class="sidebar-tip">
                <div class="tip-icon">✦</div>
                <h6>Small steps matter</h6>
                <p>Build balanced habits, one meal at a time.</p>
            </div>
        </aside>

        <main id="app" class="main-content" aria-live="polite">
            <div class="text-secondary">Loading NutriTrack...</div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
