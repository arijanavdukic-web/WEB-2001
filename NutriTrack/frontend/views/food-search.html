
<section class="container-fluid p-0">
    <div class="mb-4">
        <p class="text-success fw-semibold small mb-1">FOOD DATABASE</p>
        <h2 class="fw-bold mb-2">Food Search</h2>
        <p class="text-secondary">Explore foods and their nutritional information.</p>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <label for="foodQuery" class="form-label fw-semibold">
                Search for food
            </label>

            <div class="d-flex flex-column flex-sm-row gap-2">
                <input id="foodQuery" class="form-control"
                       type="search" placeholder="e.g. apple, oats, yogurt">

                <button id="searchFoodButton" class="btn btn-success"
                        type="button">
                    Search
                </button>
            </div>

            <p class="small text-secondary mt-2 mb-0">
                Search results are provided by USDA FoodData Central.
            </p>
        </div>
    </div>

    <div id="foodSearchMessage" class="mb-3"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Search results</h5>
    </div>

    <div id="foodResults" class="row g-3">
        <div class="col-12">
            <p class="text-secondary">
                Search for a food to see its nutritional information.
            </p>
        </div>
    </div>
</section>
