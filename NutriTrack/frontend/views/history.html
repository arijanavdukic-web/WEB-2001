
<section class="container-fluid p-0">
    <div class="mb-4">
        <p class="text-success fw-semibold small mb-1">YOUR PROGRESS</p>
        <h2 class="fw-bold mb-2">Nutrition History</h2>
        <p class="text-secondary">Review your previous food diary entries.</p>
    </div>

    <div id="historyMessage" class="small mb-3"></div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-secondary small mb-2">TRACKING PERIOD</p>
                    <h4 class="fw-bold" id="historyPeriod">Last 7 days</h4>
                    <p class="text-secondary mb-0" id="historyPeriodDescription">
                        Your recorded nutrition history.
                    </p>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-secondary small mb-2">RECORD STATUS</p>
                    <h4 class="fw-bold" id="historyStatus">Loading...</h4>
                    <p class="text-secondary mb-0" id="historyStatusDescription">
                        Loading your recorded days.
                    </p>
                    <button class="btn btn-success mt-3"
                            type="button" data-page="diary">
                        Open diary
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between
                        align-items-center gap-3 mb-3">
                <div>
                    <h5 class="fw-bold mb-1">Previous entries</h5>
                    <p class="text-secondary small mb-0">
                        Your daily nutrition records.
                    </p>
                </div>

                <select class="form-select"
                        id="historyFilter"
                        style="max-width: 180px;"
                        aria-label="Select history period">
                    <option value="7">Last 7 days</option>
                    <option value="30">Last 30 days</option>
                    <option value="all">All time</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Date</th>
                            <th>Meals</th>
                            <th>Foods</th>
                            <th>Calories</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="5" class="text-center py-4">
                                Loading history...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
